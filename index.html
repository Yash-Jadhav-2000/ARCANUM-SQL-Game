const loadScript = (src) =>
  new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

CREATE TABLE houses (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  founder TEXT,
  element TEXT,
  color TEXT,
  points INTEGER DEFAULT 0
);

CREATE TABLE students (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  house_id INTEGER,
  year INTEGER,
  age INTEGER,
  wand_core TEXT,
  blood_status TEXT,
  points INTEGER DEFAULT 0,
  is_prefect INTEGER DEFAULT 0,
  rival_id INTEGER,
  FOREIGN KEY (house_id) REFERENCES houses(id)
);

CREATE TABLE professors (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  subject TEXT,
  house_id INTEGER,
  years_teaching INTEGER
);

CREATE TABLE wands (
  id INTEGER PRIMARY KEY,
  owner_id INTEGER,
  wood TEXT,
  core TEXT,
  length_inches REAL,
  power INTEGER,
  is_lost INTEGER DEFAULT 0
);

CREATE TABLE spells (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  incantation TEXT,
  spell_type TEXT,
  difficulty INTEGER,
  effect TEXT,
  is_forbidden INTEGER DEFAULT 0
);

CREATE TABLE creatures (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  habitat TEXT,
  danger_level INTEGER,
  is_magical INTEGER DEFAULT 1,
  diet TEXT,
  parent_id INTEGER
);

CREATE TABLE potions (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  difficulty INTEGER,
  brewing_minutes INTEGER,
  effect TEXT,
  price_galleons INTEGER
);

CREATE TABLE ingredients (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  rarity TEXT,
  source TEXT,
  price_per_unit INTEGER
);

CREATE TABLE potion_ingredients (
  potion_id INTEGER,
  ingredient_id INTEGER,
  quantity INTEGER,
  FOREIGN KEY (potion_id) REFERENCES potions(id),
  FOREIGN KEY (ingredient_id) REFERENCES ingredients(id)
);

CREATE TABLE enrollments (
  id INTEGER PRIMARY KEY,
  student_id INTEGER,
  subject TEXT,
  grade INTEGER,
  semester TEXT
);

CREATE TABLE owls (
  id INTEGER PRIMARY KEY,
  name TEXT,
  age INTEGER,
  species TEXT,
  owner_id INTEGER
);

CREATE TABLE treasure (
  id INTEGER PRIMARY KEY,
  vault_name TEXT,
  gold INTEGER,
  guardian TEXT
);

CREATE TABLE forest_zones (
  id INTEGER PRIMARY KEY,
  name TEXT,
  is_magical INTEGER,
  threat_level INTEGER
);

CREATE TABLE creature_sightings (
  id INTEGER PRIMARY KEY,
  creature_id INTEGER,
  zone_id INTEGER,
  sighting_date TEXT
);

-- mutable tables for World 7 (UPDATE/DELETE/transactions)
CREATE TABLE cursed_records (
  id INTEGER PRIMARY KEY,
  student_id INTEGER,
  curse_text TEXT,
  is_active INTEGER DEFAULT 1,
  inscribed_on TEXT
);

CREATE TABLE broken_logs (
  id INTEGER PRIMARY KEY,
  log_text TEXT,
  is_corrupt INTEGER,
  log_date TEXT
);

CREATE TABLE kingdom_db (
  id INTEGER PRIMARY KEY,
  artifact_name TEXT,
  is_restored INTEGER DEFAULT 0,
  power_level INTEGER
);

const TOWER_FLOORS = [
  // floors 1-3: SELECT/WHERE basics with random target
  { gen: () => {
    const houseId = 1 + Math.floor(Math.random() * 4);
    const houseName = HOUSES.find(h => h.id === houseId).name;
    return {
      prompt: `Show all students in house ${houseName} (house_id = ${houseId}).`,
      expectedSql: `SELECT name FROM students WHERE house_id = ${houseId}`,
      validate: (rows) => rows.length === 7,
      seconds: 40,
    };
  }},
  // floor type 2: ORDER BY
  { gen: () => {
    const dir = Math.random() < 0.5 ? 'ASC' : 'DESC';
    return {
      prompt: `Show all wands ordered by power ${dir}.`,
      expectedSql: `SELECT id, power FROM wands ORDER BY power ${dir}`,
      validate: (rows) => {
        if (rows.length !== 30) return false;
        for (let i = 1; i < rows.length; i++) {
          if (dir === 'ASC' && rows[i][1] < rows[i-1][1]) return false;
          if (dir === 'DESC' && rows[i][1] > rows[i-1][1]) return false;
        }
        return true;
      },
      seconds: 40,
    };
  }},
  // floor type 3: aggregation
  { gen: () => {
    return {
      prompt: `Count students per year (GROUP BY year).`,
      expectedSql: `SELECT year, COUNT(*) FROM students GROUP BY year`,
      validate: (rows) => rows.length === 7 && rows.every(r => r[1] === 4),
      seconds: 50,
    };
  }},
  // floor type 4: JOIN
  { gen: () => {
    return {
      prompt: `Show every student's name with their house's name (INNER JOIN).`,
      expectedSql: `SELECT s.name, h.name FROM students s JOIN houses h ON s.house_id = h.id`,
      validate: (rows) => rows.length === 28,
      seconds: 60,
    };
  }},
  // floor type 5: subquery
  { gen: () => {
    return {
      prompt: `Find creatures whose danger_level equals the maximum danger_level.`,
      expectedSql: `SELECT name FROM creatures WHERE danger_level = (SELECT MAX(danger_level) FROM creatures)`,
      validate: (rows) => rows.length === 2,
      seconds: 70,
    };
  }},
  // floor type 6: window
  { gen: () => {
    return {
      prompt: `Rank students by points within each house using RANK() window function.`,
      expectedSql: `SELECT name, house_id, RANK() OVER (PARTITION BY house_id ORDER BY points DESC) FROM students`,
      validate: (rows, cols) => rows.length === 28 && cols.length === 3,

    };
  }},
];

const generateTowerFloor = (floor) => {
  // Difficulty escalates with floor number
  const idx = Math.min(Math.floor((floor - 1) / 2), TOWER_FLOORS.length - 1);
  return TOWER_FLOORS[idx].gen();
};

// ============================================================================
// MAIN COMPONENT
// ============================================================================
function ArcanumAcademy() {
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [db, setDb] = useState(null);
  const [SQL, setSQL] = useState(null);
  const [screen, setScreen] = useState("loading");
  const [house, setHouse] = useState(null);
  const [playerName, setPlayerName] = useState("");
  const [activeMission, setActiveMission] = useState(null);
  const [theme, setTheme] = useState("dark");
  const [progress, setProgress] = useState({
    completed: [], xp: 0, coins: 0, achievements: [], hintsUsed: {},
    arenaWins: 0, towerHighest: 0,
    ownedCosmetics: ["robe_init", "wand_oak", "title_query_apprentice"],
    equipped: { robe: "robe_init", wand: "wand_oak", title: "title_query_apprentice" },
  });

  // Load libs + init db
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        await Promise.all([
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"),
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"),
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"),
        ]);
        if (cancelled) return;
        const sqlLib = await window.initSqlJs({
          locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`,
        });
        if (cancelled) return;
        const database = new sqlLib.Database();
        database.run(SCHEMA_SQL);
        setSQL(sqlLib);
        setDb(database);
        setLoaded(true);
        setTimeout(() => setScreen("intro"), 500);
      } catch (e) {
        console.error(e);
        setLoadError(String(e));
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Restore save
  useEffect(() => {
    if (!loaded) return;
    try {
      const saved = JSON.parse(localStorage.getItem("arcanum_save_v2") || "null");
      if (saved && saved.house) {
        setHouse(saved.house);
        setPlayerName(saved.playerName || "");
        setProgress({...progress, ...saved.progress});
        setScreen(saved.screen || "hub");
      }
    } catch {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (!loaded || !house) return;
    try {
      localStorage.setItem("arcanum_save_v2", JSON.stringify({
        house, playerName, progress, screen,
      }));
    } catch {}
  }, [house, playerName, progress, screen, loaded]);

  // Reset DB to fresh state (used when starting a mutation mission)
  const resetDb = useCallback(() => {
    if (!SQL) return null;
    const fresh = new SQL.Database();
    fresh.run(SCHEMA_SQL);
    setDb(fresh);
    return fresh;
  }, [SQL]);

  const completeMission = useCallback((missionId) => {
    setProgress(p => {
      if (p.completed.includes(missionId)) return p;
      const m = MISSIONS.find(m => m.id === missionId);
      if (!m) return p;
      const newAch = [...p.achievements];
      if (!newAch.includes("first_spell")) newAch.push("first_spell");
      if (!p.hintsUsed[missionId] && !newAch.includes("no_hint_run")) newAch.push("no_hint_run");
      if (m.isBoss && !newAch.includes("boss_slain")) newAch.push("boss_slain");
      // World completion
      const worldMissions = MISSIONS.filter(mm => mm.world === m.world).map(mm => mm.id);
      const allDone = worldMissions.every(id => id === missionId || p.completed.includes(id));
      if (allDone) {
        const key = `world_${m.world}`;
        if (!newAch.includes(key)) newAch.push(key);
      }
      return {
        ...p,
        completed: [...p.completed, missionId],
        xp: p.xp + m.xp,
        coins: p.coins + m.coins,
        achievements: newAch,
      };
    });
  }, []);

  if (loadError) {
    return <div style={{padding:40, color:"#d4c5a0", fontFamily:"serif"}}><h2>The runes refuse to align…</h2><pre>{loadError}</pre></div>;
  }

  return (
    <div className="arcanum-root" data-theme={theme}>
      <Styles />
      <CosmicBackground />
      {!loaded && <LoadingVeil />}
      {loaded && screen === "intro" && <IntroScreen onBegin={() => setScreen("sorting")} />}
      {loaded && screen === "sorting" && (
        <SortingScreen
          playerName={playerName}
          setPlayerName={setPlayerName}
          onSorted={(h) => { setHouse(h); setScreen("hub"); }}
        />
      )}
      {loaded && screen === "hub" && house && (
        <HubScreen
          house={house}
          playerName={playerName}
          progress={progress}
          theme={theme}
          setTheme={setTheme}
          onSelectMission={(m) => { setActiveMission(m); setScreen("mission"); }}
          onGoArena={() => setScreen("arena")}
          onGoTower={() => setScreen("tower")}
          onGoShop={() => setScreen("shop")}
          onReset={() => {
            localStorage.removeItem("arcanum_save_v2");
            setHouse(null); setPlayerName("");
            setProgress({ completed: [], xp: 0, coins: 0, achievements: [], hintsUsed: {}, arenaWins: 0, towerHighest: 0, ownedCosmetics: ["robe_init", "wand_oak", "title_query_apprentice"], equipped: { robe: "robe_init", wand: "wand_oak", title: "title_query_apprentice" }, });
            setScreen("intro");
          }}
        />
      )}
      {loaded && screen === "mission" && activeMission && (
        <MissionScreen
          mission={activeMission}
          db={db}
          house={house}
          progress={progress}
          setProgress={setProgress}
          resetDb={resetDb}
          onComplete={() => { completeMission(activeMission.id); setScreen("hub"); }}
          onExit={() => setScreen("hub")}
        />
      )}
      {loaded && screen === "arena" && (
        <ArenaScreen
          db={db}
          house={house}
          progress={progress}
          setProgress={setProgress}
          onExit={() => setScreen("hub")}
        />
      )}
      {loaded && screen === "tower" && (
        <TowerScreen
          db={db}
          house={house}
          progress={progress}
          setProgress={setProgress}
          onExit={() => setScreen("hub")}
        />
      )}
      {loaded && screen === "shop" && (
        <ShopScreen
          progress={progress}
          setProgress={setProgress}
          house={house}
          onExit={() => setScreen("hub")}
        />
      )}
      <footer className="arcanum-footer">
        <span>Forged by</span>
        <a href="https://www.linkedin.com/in/yashjadhav20/" target="_blank" rel="noopener noreferrer" className="footer-credit">
          Yash Rajesh Jadhav
        </a>
        <span className="footer-tag">· Design Technologist</span>
      </footer>
    </div>
  );
}

// ============================================================================
// COSMIC BACKGROUND (Three.js)
// ============================================================================
function CosmicBackground() {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.THREE || !ref.current) return;
    const THREE = window.THREE;
    const mount = ref.current;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, mount.clientWidth/mount.clientHeight, 0.1, 1000);
    camera.position.z = 30;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    renderer.setClearColor(0x000000, 0);
    mount.appendChild(renderer.domElement);

    const N = 800;
    const positions = new Float32Array(N*3);
    const colors = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      positions[i*3] = (Math.random()-0.5)*100;
      positions[i*3+1] = (Math.random()-0.5)*60;
      positions[i*3+2] = (Math.random()-0.5)*50;
      const t = Math.random();
      colors[i*3] = 0.85+t*0.15;
      colors[i*3+1] = 0.7+t*0.2;
      colors[i*3+2] = 0.4+t*0.4;
    }
    const pGeom = new THREE.BufferGeometry();
    pGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    pGeom.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    const points = new THREE.Points(pGeom, new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending }));
    scene.add(points);

    const rings = [];
    for (let i = 0; i < 4; i++) {
      const geom = new THREE.RingGeometry(3+i*1.5, 3.1+i*1.5, 64);
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.08+i*0.05, 0.6, 0.5), transparent: true, opacity: 0.18, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(geom, mat);
      ring.position.set((i-1.5)*8, (i%2===0?1:-1)*3, -10-i*2);
      ring.rotation.x = Math.PI/2;
      scene.add(ring);
      rings.push(ring);
    }

    let mx = 0, my = 0;
    const onMove = e => { mx = (e.clientX/window.innerWidth-0.5)*2; my = (e.clientY/window.innerHeight-0.5)*2; };
    window.addEventListener("mousemove", onMove);
    const onResize = () => {
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener("resize", onResize);

    let raf;
    const animate = (t) => {
      const time = t * 0.0001;
      points.rotation.y = time * 0.3;
      points.rotation.x = time * 0.1;
      rings.forEach((r, i) => {
        r.rotation.z = time * (0.3 + i*0.1);
        r.position.y = (i%2===0?1:-1) * (3 + Math.sin(time*2 + i)*0.5);
      });
      camera.position.x += (mx*3 - camera.position.x) * 0.02;
      camera.position.y += (-my*2 - camera.position.y) * 0.02;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("resize", onResize);
      try { mount.removeChild(renderer.domElement); } catch {}
      pGeom.dispose();
      points.material.dispose();
      rings.forEach(r => { r.geometry.dispose(); r.material.dispose(); });
      renderer.dispose();
    };
  }, []);
  return <div ref={ref} className="cosmic-bg" aria-hidden="true" />;
}

      window.anime({ targets: containerRef.current, opacity: [1,0], scale: [1,0.95], duration: 600, easing: "easeInExpo", complete: () => onSorted(h) });
    } else onSorted(h);
  };
  return (
    <div className="screen sort-screen" ref={containerRef}>
      <h2 className="sort-title">The Sorting</h2>
      <p className="sort-flavor">The hat whispers your name. State it, then choose where your magic dwells.</p>
      <input className="sort-name-input" placeholder="Speak your name…" value={name} onChange={e => setName(e.target.value)} maxLength={32} />
      <div className="sort-houses">
        {HOUSES.map(h => (
          <button key={h.id} className="sort-house"
            style={{ "--house-color": h.color, borderColor: hovered === h.id ? h.color : "rgba(212,197,160,0.25)" }}
            onMouseEnter={() => setHovered(h.id)} onMouseLeave={() => setHovered(null)} onClick={() => choose(h)}>
            <div className="sort-house-glyph" style={{color: h.color}}>{h.glyph}</div>
            <div className="sort-house-name">{h.name}</div>
            <div className="sort-house-elem">{h.element} · {h.virtue}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

              </div>

      </section>

      {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
    </div>
  );
}

function MissionScreen({ mission, db, house, progress, setProgress, resetDb, onComplete, onExit }) {
  const [sql, setSql] = useState(mission.starter || "");
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [hintLevel, setHintLevel] = useState(0);
  const [showSchema, setShowSchema] = useState(false);
  const [success, setSuccess] = useState(false);
  const [executionTime, setExecutionTime] = useState(null);
  const [activeDb, setActiveDb] = useState(db);
  const editorRef = useRef(null);
  const screenRef = useRef(null);

  // For mutation missions: reset DB on entry to give a fresh state
  useEffect(() => {
    if (mission.isMutation && resetDb) {
      const fresh = resetDb();
      if (fresh) setActiveDb(fresh);
    } else {
      setActiveDb(db);
    }
  }, [mission.id]);

  useEffect(() => {
    if (!window.anime) return;
    window.anime({ targets: screenRef.current, opacity: [0,1], duration: 600, easing: "easeOutExpo" });
    window.anime({ targets: ".mission-panel", opacity: [0,1], translateY: [20,0], delay: window.anime.stagger(120, {start: 100}), duration: 700, easing: "easeOutExpo" });
  }, [mission.id]);

  const runQuery = useCallback(() => {
    setError(null);
    setResults(null);
    setSuccess(false);
    if (!sql.trim() || !activeDb) return;
    try {
      const t0 = performance.now();
      const trimmed = sql.trim().replace(/;+\s*$/, "");
      // For mutation missions, we allow UPDATE/DELETE/INSERT/BEGIN/COMMIT
      // The query may contain multiple statements separated by ;
      // We execute all but only show the result of the last SELECT
      const statements = trimmed.split(/;\s*\n?/).map(s => s.trim()).filter(s => s.length > 0);
      let lastSelectResult = null;

      for (const stmt of statements) {
        const firstWord = stmt.split(/\s+/)[0].toUpperCase();
        if (mission.isMutation) {
          // Only allow safe mutation keywords
          if (!["SELECT","WITH","UPDATE","DELETE","INSERT","BEGIN","COMMIT","ROLLBACK","CREATE","DROP"].includes(firstWord)) {
            throw new Error(`Statement type "${firstWord}" not permitted here.`);
          }
        } else {
          if (!["SELECT","WITH"].includes(firstWord)) {
            throw new Error("Only SELECT and WITH (CTE) queries are accepted within these halls.");
          }
        }

        if (["SELECT", "WITH"].includes(firstWord)) {
          const s = activeDb.prepare(stmt);
          const rows = [];
          let cols = [];
          while (s.step()) {
            if (cols.length === 0) cols = s.getColumnNames();
            rows.push(s.get());
          }
          if (cols.length === 0) try { cols = s.getColumnNames(); } catch {}
          s.free();
          lastSelectResult = { cols, rows };
        } else {
          activeDb.run(stmt);
        }
      }

      const t1 = performance.now();
      setExecutionTime((t1 - t0).toFixed(2));
      if (lastSelectResult) {
        setResults(lastSelectResult);
        if (mission.validate(lastSelectResult.rows, lastSelectResult.cols)) {
          setSuccess(true);
          triggerSpellAnimation(house.color);
        }
      } else {
        // No SELECT was issued — for mutation missions, that's a problem
        if (mission.isMutation) {
          setError("Issue a SELECT after your mutation to verify the result.");
        }
      }
    } catch (e) {
      setError(e.message);
    }
  }, [sql, activeDb, mission, house]);

  const useHint = (lvl) => {
    setHintLevel(Math.max(hintLevel, lvl));
    setProgress(p => ({ ...p, hintsUsed: { ...p.hintsUsed, [mission.id]: true } }));
  };

  const insertSnippet = (sn) => {
    const ta = editorRef.current;
    if (!ta) { setSql(sql + sn); return; }
    const s = ta.selectionStart, e = ta.selectionEnd;
    setSql(sql.slice(0,s) + sn + sql.slice(e));
    setTimeout(() => { ta.focus(); ta.selectionStart = ta.selectionEnd = s + sn.length; }, 10);
  };

  const isAlreadyDone = progress.completed.includes(mission.id);

  return (
    <div className="screen mission-screen" ref={screenRef}>
      <header className="mission-header">
        <button className="btn-ghost" onClick={onExit}>← Return to Castle</button>
        <div className="mission-loc">
          <div className="mission-roman">WORLD {toRoman(mission.world)} · {mission.isBoss ? "BOSS" : "TRIAL"}</div>
          <h2 className="mission-name">{mission.title}</h2>
          <div className="mission-where">{mission.location}</div>
        </div>
        <div className="mission-rewards-banner">
          <span>{mission.xp} xp</span>
          <span>⛂ {mission.coins}</span>
        </div>
      </header>

      <div className="mission-body">
        <aside className="mission-panel mission-story-panel">
          <div className="panel-flag">THE TASK</div>
          <p className="mission-story">{mission.story}</p>
          <div className="mission-objective">
            <div className="obj-label">objective</div>
            <div className="obj-text">{mission.objective}</div>
          </div>
          <div className="mission-concept-tag"><span>concept · </span><strong>{mission.concept}</strong></div>
          {mission.isMutation && (
            <div className="mutation-warning">
              ⚠ This trial alters the database. The state has been reset for you.
            </div>
          )}
          <button className="btn-link" onClick={() => setShowSchema(!showSchema)}>{showSchema ? "Hide schema" : "Show schema"}</button>
          {showSchema && <SchemaViewer />}
        </aside>

        <section className="mission-panel mission-editor-panel">
          <div className="panel-flag">YOUR INCANTATION</div>
          <div className="editor-toolbar">
            {mission.isMutation
              ? ["UPDATE ", "DELETE ", "SET ", "WHERE ", "SELECT ", "FROM "].map(s => <button key={s} className="snip-btn" onClick={() => insertSnippet(s)}>{s.trim()}</button>)
              : ["SELECT ", "FROM ", "WHERE ", "GROUP BY ", "HAVING ", "ORDER BY ", "JOIN ", "LIMIT "].map(s => <button key={s} className="snip-btn" onClick={() => insertSnippet(s)}>{s.trim()}</button>)
            }
          </div>
          <textarea ref={editorRef} className="sql-editor" value={sql} onChange={e => setSql(e.target.value)}
            onKeyDown={e => {
              if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runQuery(); }
              if (e.key === "Tab") {
                e.preventDefault();
                const ta = e.target;
                const s = ta.selectionStart, en = ta.selectionEnd;
                setSql(sql.slice(0,s) + "  " + sql.slice(en));
                setTimeout(() => { ta.selectionStart = ta.selectionEnd = s + 2; }, 0);
              }
            }} spellCheck={false} placeholder="-- speak the query…" />
          <div className="editor-actions">
            <button className="btn-primary btn-cast" onClick={runQuery}>✦ Cast Query <span className="kbd">⌘↵</span></button>
            <button className="btn-ghost" onClick={() => setSql(mission.starter || "")}>Reset Scroll</button>
            {mission.isMutation && (
              <button className="btn-ghost" onClick={() => { const fresh = resetDb(); if (fresh) { setActiveDb(fresh); setResults(null); setError(null); setSuccess(false); } }}>
                ↺ Reset DB
              </button>
            )}
          </div>

          {error && <div className="result-error"><div className="err-flag">THE SPELL FALTERS</div><pre>{error}</pre></div>}
          {results && <ResultsTable cols={results.cols} rows={results.rows} executionTime={executionTime} success={success} />}

          {success && (
            <div className="success-card">
              <div className="success-glyph">{mission.isFinalBoss ? "♛" : mission.isBoss ? "★" : "✦"}</div>
              <div className="success-text">
                <div className="success-headline">{mission.isFinalBoss ? "THE KINGDOM IS SAVED." : mission.isBoss ? "Boss vanquished." : "The runes ignite."}</div>
                <div className="success-sub">+{mission.xp} XP · +{mission.coins} galleons</div>
              </div>
              <button className="btn-primary" onClick={onComplete}>{isAlreadyDone ? "Continue" : "Claim Reward"}</button>
            </div>
          )}
        </section>

        <aside className="mission-panel mission-mentor-panel">
          <div className="panel-flag">PROFESSOR ALDRIC</div>
          <div className="mentor-portrait">✦</div>
          <div className="mentor-quote">
            {hintLevel === 0 && "I shall whisper hints — but only if asked. Most students learn fastest from their own faltering."}
            {hintLevel >= 1 && mission.mentor}
            {hintLevel >= 2 && (
              <>
                <hr style={{margin:"12px 0", border:"none", borderTop:"1px solid rgba(212,197,160,0.2)"}}/>
                <div style={{opacity:0.7, fontSize:"0.85em", marginBottom:6}}>The full incantation:</div>
                <pre className="mentor-answer">{mission.expectedSql};</pre>
              </>
            )}
          </div>
          <div className="mentor-actions">
            {hintLevel < 1 && <button className="btn-link" onClick={() => useHint(1)}>Ask for a hint</button>}
            {hintLevel < 2 && hintLevel >= 1 && <button className="btn-link" onClick={() => useHint(2)}>Show me the way</button>}
          </div>
        </aside>
      </div>
    </div>
  );
}

function ArenaScreen({ db, house, progress, setProgress, onExit }) {
  const [round, setRound] = useState(0); // 0 = lobby
  const [challenge, setChallenge] = useState(null);
  const [sql, setSql] = useState("");
  const [timeLeft, setTimeLeft] = useState(0);
  const [verdict, setVerdict] = useState(null); // null, 'won', 'lost', 'timeup'
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [showSchema, setShowSchema] = useState(false);
  const timerRef = useRef(null);

  const startRound = () => {
    const c = ARENA_POOL[Math.floor(Math.random() * ARENA_POOL.length)];
    setChallenge(c);
    setSql("");
    setVerdict(null);
    setResults(null);
    setError(null);
    setTimeLeft(c.seconds);
    setRound(round + 1);
  };

  useEffect(() => {
    if (!challenge || verdict) return;
    timerRef.current = setInterval(() => {
      setTimeLeft(t => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          setVerdict('timeup');
          setStreak(0);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [challenge, verdict]);

  const submit = () => {
    if (!challenge || !db) return;
    try {
      const trimmed = sql.trim().replace(/;+\s*$/, "");
      const fw = trimmed.split(/\s+/)[0].toUpperCase();
      if (!["SELECT","WITH"].includes(fw)) {
        setError("Only SELECT/WITH allowed in the arena.");
        return;
      }
      const stmt = db.prepare(trimmed);
      const rows = [];
      let cols = [];
      while (stmt.step()) {
        if (cols.length === 0) cols = stmt.getColumnNames();
        rows.push(stmt.get());
      }
      if (cols.length === 0) try { cols = stmt.getColumnNames(); } catch {}
      stmt.free();
      setResults({ cols, rows });
      setError(null);
      if (challenge.validate(rows, cols)) {
        clearInterval(timerRef.current);
        const points = Math.max(10, timeLeft * 2);
        setScore(s => s + points);
        setStreak(s => s + 1);
        setProgress(p => {
          const newAch = [...p.achievements];
          const wins = (p.arenaWins || 0) + 1;
          if (wins >= 5 && !newAch.includes("arena_5")) newAch.push("arena_5");
          return { ...p, arenaWins: wins, coins: p.coins + 15, achievements: newAch };
        });
        triggerSpellAnimation(house.color);
        setVerdict('won');
      }
    } catch (e) {
      setError(e.message);
    }
  };

  if (round === 0) {
    return (
      <div className="screen arena-screen">
        <header className="screen-header">
          <button className="btn-ghost" onClick={onExit}>← Return to Castle</button>
          <h2 className="screen-title">⚡ ARENA</h2>
          <button className="btn-ghost" onClick={() => setShowSchema(true)}>⛬ Schema</button>
        </header>
        <div className="arena-lobby">
          <div className="lobby-glyph">⚡</div>
          <h3>Timed Query Duels</h3>
          <p className="arena-flavor">A challenge appears. You have seconds, not minutes. Answer correctly and time bleeds into score. Fail, and the streak resets.</p>
          <div className="arena-stats">
            <div><span className="stat-label">Total wins</span><span className="stat-value">{progress.arenaWins || 0}</span></div>
            <div><span className="stat-label">This session</span><span className="stat-value">{score} pts</span></div>
            <div><span className="stat-label">Streak</span><span className="stat-value">{streak}🔥</span></div>
          </div>
          <button className="btn-primary btn-shimmer" onClick={startRound}><span>Begin Round 1</span></button>
        </div>
        {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
      </div>
    );
  }

  return (
    <div className="screen arena-screen">
      <header className="screen-header">
        <button className="btn-ghost" onClick={onExit}>← Forfeit</button>
        <h2 className="screen-title">⚡ ARENA · ROUND {round}</h2>
        <div className="header-right-cluster">
          <button className="btn-ghost btn-tight" onClick={() => setShowSchema(true)}>⛬ Schema</button>
          <div className="arena-score">Score: {score} · Streak: {streak}🔥</div>
        </div>
      </header>

      <div className="arena-body">
        <div className={`arena-timer ${timeLeft <= 10 ? 'critical' : ''}`}>
          <div className="timer-value">{timeLeft}</div>
          <div className="timer-bar"><div className="timer-fill" style={{ width: `${(timeLeft / challenge.seconds) * 100}%` }} /></div>
        </div>

        <div className="arena-challenge">
          <div className="challenge-flag">CHALLENGE</div>
          <p className="challenge-prompt">{challenge.prompt}</p>
        </div>

        <textarea className="sql-editor arena-editor" value={sql} onChange={e => setSql(e.target.value)} disabled={!!verdict}
          onKeyDown={e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); } }}
          placeholder="-- query before time runs out…" autoFocus />

        <div className="editor-actions">
          <button className="btn-primary btn-cast" onClick={submit} disabled={!!verdict}>✦ Cast <span className="kbd">⌘↵</span></button>
        </div>

        {error && <div className="result-error"><pre>{error}</pre></div>}
        {results && <ResultsTable cols={results.cols} rows={results.rows} executionTime={null} success={verdict === 'won'} />}

        {verdict === 'won' && (
          <div className="success-card">
            <div className="success-glyph">⚡</div>
            <div className="success-text">
              <div className="success-headline">VICTORY · +{Math.max(10, timeLeft * 2)} pts</div>
              <div className="success-sub">+15 galleons · streak grows</div>
            </div>
            <button className="btn-primary" onClick={startRound}>Next Round</button>
          </div>
        )}
        {verdict === 'timeup' && (
          <div className="failure-card">
            <div className="failure-glyph">✗</div>
            <div className="failure-text">
              <div className="failure-headline">TIME EXPIRED</div>
              <div className="failure-sub">The expected query: <code>{challenge.expectedSql}</code></div>
            </div>
            <button className="btn-primary" onClick={startRound}>Try Another</button>
          </div>
        )}
      </div>
      {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
    </div>
  );
}

function TowerScreen({ db, house, progress, setProgress, onExit }) {
  const [floor, setFloor] = useState(0); // 0 = lobby
  const [challenge, setChallenge] = useState(null);
  const [sql, setSql] = useState("");
  const [timeLeft, setTimeLeft] = useState(0);
  const [lives, setLives] = useState(3);
  const [verdict, setVerdict] = useState(null);
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [showSchema, setShowSchema] = useState(false);
  const timerRef = useRef(null);

  const startFloor = (f) => {
    const c = generateTowerFloor(f);
    setChallenge(c);
    setSql("");
    setVerdict(null);
    setResults(null);
    setError(null);
    setTimeLeft(c.seconds);
    setFloor(f);
  };

  useEffect(() => {
    if (!challenge || verdict) return;
    timerRef.current = setInterval(() => {
      setTimeLeft(t => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          setVerdict('timeup');
          setLives(l => l - 1);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [challenge, verdict]);

  // End run if no lives
  useEffect(() => {
    if (lives < 0 && verdict === 'timeup') {
      // record highest
      setProgress(p => {
        const newAch = [...p.achievements];
        if (floor >= 10 && !newAch.includes("tower_10")) newAch.push("tower_10");
        return { ...p, towerHighest: Math.max(p.towerHighest || 0, floor - 1), coins: p.coins + Math.max(0, (floor-1)*5), achievements: newAch };
      });
    }
  }, [lives, verdict]);

  const submit = () => {
    if (!challenge || !db) return;
    try {
      const trimmed = sql.trim().replace(/;+\s*$/, "");
      const fw = trimmed.split(/\s+/)[0].toUpperCase();
      if (!["SELECT","WITH"].includes(fw)) {
        setError("Only SELECT/WITH allowed.");
        return;
      }
      const stmt = db.prepare(trimmed);
      const rows = [];
      let cols = [];
      while (stmt.step()) { if (cols.length === 0) cols = stmt.getColumnNames(); rows.push(stmt.get()); }
      if (cols.length === 0) try { cols = stmt.getColumnNames(); } catch {}
      stmt.free();
      setResults({ cols, rows });
      setError(null);
      if (challenge.validate(rows, cols)) {
        clearInterval(timerRef.current);
        triggerSpellAnimation(house.color);
        setVerdict('won');
      }
    } catch (e) {
      setError(e.message);
    }
  };

  if (floor === 0) {
    return (
      <div className="screen tower-screen">
        <header className="screen-header">
          <button className="btn-ghost" onClick={onExit}>← Return to Castle</button>
          <h2 className="screen-title">▲ ENDLESS TOWER</h2>
          <button className="btn-ghost" onClick={() => setShowSchema(true)}>⛬ Schema</button>
        </header>
        <div className="tower-lobby">
          <div className="lobby-glyph">▲</div>
          <h3>The Tower of Endless Trials</h3>
          <p className="arena-flavor">Each floor harder than the last. Three lives. No retries within a run. Climb until you fall — and the floor you reach is yours forever.</p>
          <div className="arena-stats">
            <div><span className="stat-label">Highest reached</span><span className="stat-value">{progress.towerHighest || 0}</span></div>
            <div><span className="stat-label">Lives</span><span className="stat-value">3 ♥</span></div>
          </div>
          <button className="btn-primary btn-shimmer" onClick={() => { setLives(3); startFloor(1); }}>
            <span>Enter the Tower</span>
          </button>
        </div>
        {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
      </div>
    );
  }

  if (lives < 0) {
    return (
      <div className="screen tower-screen">
        <header className="screen-header">
          <button className="btn-ghost" onClick={onExit}>← Return to Castle</button>
          <h2 className="screen-title">▲ ENDLESS TOWER</h2>
          <button className="btn-ghost" onClick={() => setShowSchema(true)}>⛬ Schema</button>
        </header>
        <div className="tower-lobby">
          <div className="lobby-glyph">✗</div>
          <h3>You fell.</h3>
          <p className="arena-flavor">You reached floor {floor}. The tower remembers.</p>
          <div className="arena-stats">
            <div><span className="stat-label">Reached</span><span className="stat-value">{floor - 1}</span></div>
            <div><span className="stat-label">Galleons earned</span><span className="stat-value">⛂ {Math.max(0, (floor-1)*5)}</span></div>
          </div>
          <button className="btn-primary" onClick={() => { setLives(3); startFloor(1); }}>Climb Again</button>
        </div>
        {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
      </div>
    );
  }

  return (
    <div className="screen tower-screen">
      <header className="screen-header">
        <button className="btn-ghost" onClick={onExit}>← Forfeit</button>
        <h2 className="screen-title">▲ FLOOR {floor}</h2>
        <div className="header-right-cluster">
          <button className="btn-ghost btn-tight" onClick={() => setShowSchema(true)}>⛬ Schema</button>
          <div className="arena-score">Lives: {"♥".repeat(Math.max(0, lives + 1))}</div>
        </div>
      </header>

      <div className="arena-body">
        <div className={`arena-timer ${timeLeft <= 10 ? 'critical' : ''}`}>
          <div className="timer-value">{timeLeft}</div>
          <div className="timer-bar"><div className="timer-fill" style={{ width: `${(timeLeft / challenge.seconds) * 100}%` }} /></div>
        </div>

        <div className="arena-challenge">
          <div className="challenge-flag">FLOOR {floor}</div>
          <p className="challenge-prompt">{challenge.prompt}</p>
        </div>

        <textarea className="sql-editor arena-editor" value={sql} onChange={e => setSql(e.target.value)} disabled={!!verdict}
          onKeyDown={e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); } }}
          placeholder="-- the floor awaits…" autoFocus />

        <div className="editor-actions">
          <button className="btn-primary btn-cast" onClick={submit} disabled={!!verdict}>✦ Cast <span className="kbd">⌘↵</span></button>
        </div>

        {error && <div className="result-error"><pre>{error}</pre></div>}
        {results && <ResultsTable cols={results.cols} rows={results.rows} executionTime={null} success={verdict === 'won'} />}

        {verdict === 'won' && (
          <div className="success-card">
            <div className="success-glyph">▲</div>
            <div className="success-text">
              <div className="success-headline">FLOOR CLEARED</div>
              <div className="success-sub">Ascend higher</div>
            </div>
            <button className="btn-primary" onClick={() => startFloor(floor + 1)}>Floor {floor + 1} ↑</button>
          </div>
        )}
        {verdict === 'timeup' && (
          <div className="failure-card">
            <div className="failure-glyph">✗</div>
            <div className="failure-text">
              <div className="failure-headline">A LIFE LOST</div>
              <div className="failure-sub">{lives - 1 >= 0 ? `${lives} ${lives===1?'life':'lives'} remain.` : 'Final breath.'}</div>
            </div>
            {lives - 1 >= 0 && <button className="btn-primary" onClick={() => startFloor(floor + 1)}>Continue ↑</button>}
          </div>
        )}
      </div>
      {showSchema && <SchemaModal onClose={() => setShowSchema(false)} />}
    </div>
  );
}

function ShopScreen({ progress, setProgress, house, onExit }) {
  const [tab, setTab] = useState("robe");
  const completedWorlds = WORLDS.filter(w => MISSIONS.filter(m => m.world === w.id).every(m => progress.completed.includes(m.id))).length;

  const buy = (item) => {
    if (progress.coins < item.cost) return;
    if (item.requires && completedWorlds < item.requires) return;
    setProgress(p => ({
      ...p,
      coins: p.coins - item.cost,
      ownedCosmetics: [...p.ownedCosmetics, item.id],
    }));
    triggerSpellAnimation(house.color);
  };

  const equip = (item) => {
    setProgress(p => ({
      ...p,
      equipped: { ...p.equipped, [item.type]: item.id },
    }));
  };

  const items = COSMETICS.filter(c => c.type === tab);

  return (
    <div className="screen shop-screen">
      <header className="screen-header">
        <button className="btn-ghost" onClick={onExit}>← Return to Castle</button>
        <h2 className="screen-title">⚜ COSMETIC VAULT</h2>
        <div className="shop-coins">⛂ {progress.coins}</div>
      </header>

      <div className="shop-tabs">
        {[{ id: "robe", label: "Robes" }, { id: "wand", label: "Wands" }, { id: "title", label: "Titles" }].map(t => (
          <button key={t.id} className={`shop-tab ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="shop-grid">
        {items.map(item => {
          const owned = progress.ownedCosmetics.includes(item.id);
          const equipped = progress.equipped[item.type] === item.id;
          const canAfford = progress.coins >= item.cost;
          const meetsReq = !item.requires || completedWorlds >= item.requires;
          return (
            <div key={item.id} className={`shop-card ${owned ? 'owned' : ''} ${equipped ? 'equipped' : ''}`}>
              <div className="shop-icon">
                {item.type === "robe" && "👘"}
                {item.type === "wand" && "🪄"}
                {item.type === "title" && "✦"}
              </div>
              <div className="shop-name">{item.name}</div>
              {!owned && (
                <>
                  <div className="shop-price">⛂ {item.cost}</div>
                  {item.requires && completedWorlds < item.requires && (
                    <div className="shop-lock">requires World {toRoman(item.requires)} cleared</div>
                  )}
                  <button className="btn-ghost shop-buy" disabled={!canAfford || !meetsReq} onClick={() => buy(item)}>
                    {!canAfford ? "Insufficient" : !meetsReq ? "Locked" : "Acquire"}
                  </button>
                </>
              )}
              {owned && !equipped && <button className="btn-ghost shop-buy" onClick={() => equip(item)}>Equip</button>}
              {equipped && <div className="shop-equipped">✓ Equipped</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ResultsTable({ cols, rows, executionTime, success }) {

        <span className="result-label">{success ? "✦ MATCHES THE PROPHECY" : "RESULT"}</span>
        <span className="result-meta">{rows.length} row{rows.length===1?"":"s"}{executionTime ? ` · ${executionTime}ms` : ""}</span>

          <div className="result-empty">No rows. The chamber is empty.</div>

          <table className="result-table">
            <thead><tr>{cols.map((c,i) => <th key={i}>{c}</th>)}</tr></thead>
            <tbody>
              {rows.slice(0,50).map((r, i) => (

function SchemaModal({ onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [onClose]);
  return (
    <div className="schema-modal-overlay" onClick={onClose}>
      <div className="schema-modal" onClick={e => e.stopPropagation()}>
        <header className="schema-modal-head">
          <div>
            <div className="schema-modal-eyebrow">DATABASE GRIMOIRE</div>
            <h3 className="schema-modal-title">Relational Schema · 17 Tables</h3>
          </div>
          <button className="schema-modal-close" onClick={onClose} aria-label="Close schema">✕</button>
        </header>
        <div className="schema-modal-body">
          <p className="schema-modal-flavor">Arrows (→) mark foreign-key relationships. Reference any table while you weave your query — the castle hides nothing from a true scholar.</p>
          <SchemaViewer />
        </div>
      </div>
    </div>
  );
}



function toRoman(n) { return ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"][n] || String(n); }

function triggerSpellAnimation(color) {
  if (!window.anime) return;
  const flash = document.createElement("div");
  flash.style.cssText = `position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, ${color}66, transparent 60%);z-index:999;opacity:0;`;
  document.body.appendChild(flash);
  window.anime({ targets: flash, opacity: [0,1,0], duration: 1400, easing: "easeOutExpo", complete: () => flash.remove() });
  for (let i = 0; i < 18; i++) {
    const m = document.createElement("div");
    m.style.cssText = `position:fixed;pointer-events:none;z-index:1000;width:6px;height:6px;border-radius:50%;background:${color};box-shadow:0 0 10px ${color};left:50%;top:50%;`;
    document.body.appendChild(m);
    window.anime({
      targets: m,
      translateX: (Math.random()-0.5) * 600,
      translateY: (Math.random()-0.5) * 600,
      opacity: [1,0],
      scale: [0.5, 2, 0],
      duration: 1200 + Math.random()*400,
      easing: "easeOutExpo",
      complete: () => m.remove(),
    });
  }
}

      }

      /* ===== SORTING ===== */
      .sort-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-top: 60px; }
      .sort-title {
        font-family: 'Cinzel', serif; font-size: 36px; color: var(--gold);
        letter-spacing: 0.3em; text-transform: uppercase; margin: 0;
      }
      .sort-flavor { color: var(--text-dim); font-style: italic; font-size: 18px; max-width: 520px; text-align: center; }
      .sort-name-input {
        background: rgba(14,10,22,0.6); border: 1px solid var(--border-hi);
        padding: 14px 22px; color: var(--text); font-family: 'Cormorant Garamond', serif;
        font-size: 20px; min-width: 320px; text-align: center;
        font-style: italic; border-radius: 2px;
      }
      .sort-name-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 20px rgba(212,197,160,0.3); }
      .sort-houses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; max-width: 1080px; width: 100%; }
      .sort-house {
        background: linear-gradient(180deg, rgba(31,24,48,0.6), rgba(14,10,22,0.75));
        border: 1px solid; border-radius: 4px;
        padding: 28px 18px; cursor: pointer; transition: all 0.3s ease;
        font-family: 'Cinzel', serif; color: var(--text);
        text-align: center;
      }
      .sort-house:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 30px var(--house-color);
      }
      .sort-house-glyph { font-size: 56px; margin-bottom: 14px; text-shadow: 0 0 20px currentColor; }
      .sort-house-name { font-size: 20px; letter-spacing: 0.15em; margin-bottom: 8px; }
      .sort-house-elem { font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--text-dim); font-size: 14px; }

      /* ===== HUB ===== */
      .hub-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      .hub-banner {
        display: flex; align-items: center; gap: 16px;
        padding: 16px 24px;
        background: linear-gradient(90deg, var(--house-color)20, transparent);
        border-left: 3px solid var(--house-color);
        border-radius: 0 4px 4px 0;
      }
      .hub-banner-glyph { font-size: 36px; color: var(--house-color); text-shadow: 0 0 20px var(--house-color); }
      .hub-banner-name { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); letter-spacing: 0.1em; }
      .hub-banner-house { font-family: 'Cormorant Garamond', serif; color: var(--text-dim); font-style: italic; font-size: 15px; }
      .hub-controls { display: flex; gap: 10px; }

      .dashboard {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px;
      }
      .dashboard-stat {
        padding: 18px 22px; background: rgba(31,24,48,0.6);
        border: 1px solid var(--border); border-radius: 3px;
      }
      .stat-label {
        font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.25em;
        text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; display: block;
      }
      .stat-value {
        font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold);
        font-weight: 600; display: block;
      }
      .xp-bar { margin-top: 12px; height: 4px; background: rgba(212,197,160,0.1); border-radius: 2px; overflow: hidden; }
      .xp-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width 0.6s ease; }

      .side-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
      .side-mode {
        display: flex; align-items: center; gap: 16px; padding: 18px 22px;
        background: linear-gradient(135deg, rgba(31,24,48,0.7), rgba(42,33,64,0.5));
        border: 1px solid var(--border); border-radius: 3px;
        cursor: pointer; transition: all 0.3s ease; text-align: left;
        color: var(--text); font-family: 'Cormorant Garamond', serif;
      }
      .side-mode:hover {
        transform: translateY(-3px); border-color: var(--gold);
        box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 30px rgba(212,197,160,0.15);
      }
      .arena-mode:hover { border-color: var(--amber); box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 30px rgba(217,119,87,0.3); }
      .tower-mode:hover { border-color: var(--violet-glow); box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 30px rgba(138,111,176,0.3); }
      .shop-mode:hover { border-color: var(--gold-bright); }
      .mode-glyph { font-size: 36px; color: var(--gold); }
      .arena-mode .mode-glyph { color: var(--amber); }
      .tower-mode .mode-glyph { color: var(--violet-glow); }
      .mode-title { font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.15em; color: var(--gold); }
      .mode-sub { color: var(--text-dim); font-style: italic; font-size: 14px; margin-top: 4px; }

      /* WORLD MAP */
      .world-map { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
      .world-card {
        background: rgba(31,24,48,0.5);
        border: 1px solid var(--border); border-radius: 3px;
        transition: all 0.3s ease;
      }
      .world-card.locked { opacity: 0.4; }
      .world-card.open { border-color: var(--border-hi); background: rgba(31,24,48,0.75); }
      .world-head {
        display: flex; align-items: center; gap: 20px; width: 100%;
        padding: 20px 24px; background: none; border: none;
        cursor: pointer; color: var(--text); text-align: left;
        font-family: 'Cormorant Garamond', serif;
      }
      .world-card.locked .world-head { cursor: not-allowed; }
      .world-glyph { font-size: 36px; color: var(--gold); flex-shrink: 0; width: 48px; text-align: center; }
      .world-info { flex: 1; }
      .world-roman { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dim); margin-bottom: 4px; }
      .world-title { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); letter-spacing: 0.08em; }
      .world-sub { color: var(--text-dim); font-style: italic; font-size: 15px; margin-top: 4px; }
      .world-story { color: var(--text-dim); font-style: italic; font-size: 15px; margin-top: 14px; padding: 12px; background: rgba(0,0,0,0.2); border-left: 2px solid var(--gold-dim); line-height: 1.5; }
      .world-progress { font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold); }
      .world-progress .lock { color: var(--text-dim); font-style: italic; font-family: 'Cormorant Garamond', serif; }

      .mission-list {
        padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 8px;
        border-top: 1px solid var(--border);
      }
      .mission-row {
        display: flex; align-items: center; gap: 16px; padding: 14px 18px;
        background: rgba(0,0,0,0.2); border: 1px solid transparent;
        cursor: pointer; transition: all 0.2s ease; text-align: left;
        color: var(--text); font-family: 'Cormorant Garamond', serif; border-radius: 3px;
      }
      .mission-row:not(.locked):hover { border-color: var(--gold-dim); background: rgba(212,197,160,0.05); }
      .mission-row.done { border-color: rgba(110,155,122,0.3); background: rgba(110,155,122,0.06); }
      .mission-row.locked { opacity: 0.4; cursor: not-allowed; }
      .mission-row.boss { border-left: 3px solid var(--amber); padding-left: 15px; }
      .mission-row.boss.done { border-left-color: var(--gold); }
      .mission-status { font-size: 22px; color: var(--gold); width: 28px; text-align: center; flex-shrink: 0; }
      .mission-row.done .mission-status { color: var(--emerald); }
      .mission-row.boss .mission-status { color: var(--amber); }
      .mission-meta { flex: 1; }
      .mission-title { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.05em; color: var(--text); }
      .mission-row.done .mission-title { color: var(--gold); }
      .mission-concept { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold-dim); letter-spacing: 0.05em; margin-top: 3px; text-transform: uppercase; }
      .mission-rewards { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold-dim); letter-spacing: 0.1em; }

      /* ACHIEVEMENTS */
      .achievements-strip { padding: 24px 0; border-top: 1px solid var(--border); }
      .ach-heading { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin: 0 0 16px; }
      .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
      .ach-card {
        padding: 14px; background: rgba(31,24,48,0.5);
        border: 1px solid var(--border); border-radius: 3px;
        transition: all 0.3s ease;
      }
      .ach-card.unlocked { border-color: var(--gold-dim); background: rgba(212,197,160,0.08); }
      .ach-card.locked { opacity: 0.35; }
      .ach-icon { font-size: 22px; color: var(--gold); }
      .ach-title { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; color: var(--text); margin: 6px 0 4px; }
      .ach-desc { font-size: 12px; color: var(--text-dim); font-style: italic; line-height: 1.4; }

      /* ===== MISSION SCREEN ===== */
      .mission-screen { padding-bottom: 80px; }
      .mission-header {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 24px; margin-bottom: 28px;
        background: linear-gradient(180deg, rgba(31,24,48,0.7), transparent);
        border-bottom: 1px solid var(--border);
      }
      .mission-loc { text-align: center; flex: 1; }
      .mission-roman { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.4em; color: var(--gold-dim); }
      .mission-name { font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold); letter-spacing: 0.1em; margin: 8px 0 4px; font-weight: 700; }
      .mission-where { color: var(--text-dim); font-style: italic; font-size: 14px; }
      .mission-rewards-banner { display: flex; gap: 16px; font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); letter-spacing: 0.1em; }

      .mission-body { display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; }
      @media (max-width: 1100px) { .mission-body { grid-template-columns: 1fr; } }
      .mission-panel {
        background: linear-gradient(180deg, rgba(31,24,48,0.7), rgba(14,10,22,0.5));
        border: 1px solid var(--border); border-radius: 3px;
        padding: 20px; backdrop-filter: blur(4px);
      }
      .panel-flag {
        font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.4em;
        color: var(--gold-dim); text-transform: uppercase; margin-bottom: 14px;
        padding-bottom: 10px; border-bottom: 1px solid var(--border);
      }
      .mission-story { color: var(--text); line-height: 1.6; font-size: 16px; font-style: italic; margin-bottom: 16px; }
      .mission-objective {
        padding: 14px; background: rgba(212,197,160,0.06);
        border-left: 3px solid var(--gold); margin: 16px 0;
      }
      .obj-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 6px; }
      .obj-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--gold-bright); line-height: 1.4; }
      .mission-concept-tag { color: var(--text-dim); font-size: 13px; font-style: italic; margin-top: 14px; }
      .mission-concept-tag strong { color: var(--gold); font-weight: 600; font-style: normal; font-family: 'JetBrains Mono', monospace; }
      .mutation-warning {
        padding: 12px; background: rgba(217,119,87,0.1);
        border-left: 3px solid var(--amber); color: var(--amber);
        font-style: italic; font-size: 14px; margin: 16px 0;
      }

      .editor-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
      .snip-btn {
        font-family: 'JetBrains Mono', monospace; font-size: 11px;
        padding: 6px 10px; background: rgba(212,197,160,0.06);
        border: 1px solid var(--border); color: var(--gold-dim);
        cursor: pointer; border-radius: 2px; transition: all 0.2s;
        letter-spacing: 0.05em;
      }
      .snip-btn:hover { color: var(--gold); border-color: var(--gold-dim); background: rgba(212,197,160,0.12); }
      .sql-editor {
        width: 100%; min-height: 220px;
        background: rgba(14,10,22,0.85); border: 1px solid var(--border);
        color: var(--gold-bright); padding: 18px;
        font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6;
        resize: vertical; border-radius: 2px; box-sizing: border-box;
      }
      .sql-editor:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 20px rgba(212,197,160,0.2); }
      .editor-actions { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }

      .result-error {
        background: rgba(185,92,92,0.1); border: 1px solid rgba(185,92,92,0.3);
        padding: 14px; margin: 14px 0; border-radius: 2px;
      }
      .err-flag { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--crimson); text-transform: uppercase; margin-bottom: 6px; }
      .result-error pre { color: var(--text); font-size: 13px; margin: 0; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; }

      .result-card {
        background: rgba(14,10,22,0.5); border: 1px solid var(--border);
        margin: 14px 0; border-radius: 2px; overflow: hidden;
      }
      .result-card.success { border-color: var(--gold); box-shadow: 0 0 30px rgba(212,197,160,0.2); }
      .result-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; background: rgba(0,0,0,0.25);
        border-bottom: 1px solid var(--border);
      }
      .result-label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; }
      .result-card.success .result-label { color: var(--gold); }
      .result-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }
      .result-table-wrap { max-height: 320px; overflow: auto; }
      .result-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      .result-table th { padding: 8px 12px; text-align: left; background: rgba(212,197,160,0.06); color: var(--gold); font-weight: 600; letter-spacing: 0.05em; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
      .result-table td { padding: 7px 12px; color: var(--text); border-bottom: 1px solid rgba(212,197,160,0.06); }
      .result-table tr:hover td { background: rgba(212,197,160,0.04); }
      .null { color: var(--gold-dim); font-style: italic; }
      .result-empty { padding: 20px; text-align: center; color: var(--text-dim); font-style: italic; }
      .result-more { padding: 10px; text-align: center; color: var(--text-dim); font-style: italic; font-size: 12px; }

      .success-card, .failure-card {
        margin: 18px 0; padding: 22px;
        display: flex; align-items: center; gap: 18px; border-radius: 3px;
      }
      .success-card {
        background: linear-gradient(135deg, rgba(110,155,122,0.15), rgba(212,197,160,0.1));
        border: 1px solid var(--gold);
        box-shadow: 0 0 40px rgba(212,197,160,0.2);
      }
      .failure-card {
        background: linear-gradient(135deg, rgba(185,92,92,0.15), rgba(185,92,92,0.05));
        border: 1px solid rgba(185,92,92,0.5);
      }
      .success-glyph, .failure-glyph { font-size: 42px; color: var(--gold); }
      .failure-glyph { color: var(--crimson); }
      .success-text, .failure-text { flex: 1; }
      .success-headline { font-family: 'Cinzel', serif; font-size: 19px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
      .failure-headline { font-family: 'Cinzel', serif; font-size: 19px; letter-spacing: 0.2em; color: var(--crimson); text-transform: uppercase; }
      .success-sub, .failure-sub { color: var(--text-dim); margin-top: 4px; font-style: italic; font-size: 14px; }
      .failure-sub code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 2px; }

      /* MENTOR */
      .mentor-portrait { font-size: 48px; text-align: center; color: var(--gold); margin-bottom: 12px; text-shadow: 0 0 20px rgba(212,197,160,0.3); }
      .mentor-quote { color: var(--text); font-style: italic; line-height: 1.6; font-size: 15px; }
      .mentor-actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
      .mentor-answer { background: rgba(0,0,0,0.4); padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold-bright); white-space: pre-wrap; border-radius: 2px; line-height: 1.5; }

      /* SCHEMA VIEWER */
      .schema-viewer { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; max-height: 400px; overflow-y: auto; }
      .schema-table {
        padding: 8px 12px; background: rgba(0,0,0,0.25);
        border-left: 2px solid var(--gold-dim); border-radius: 0 2px 2px 0;
      }
      .schema-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 4px; letter-spacing: 0.05em; }
      .schema-table ul { margin: 0; padding-left: 16px; list-style: none; }
      .schema-table li { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); line-height: 1.5; position: relative; }
      .schema-table li::before { content: "·"; position: absolute; left: -10px; color: var(--gold-dim); }

      /* ===== ARENA ===== */
      .arena-screen, .tower-screen, .shop-screen { padding-bottom: 60px; }
      .arena-lobby, .tower-lobby {
        text-align: center; max-width: 640px; margin: 60px auto;
        padding: 48px;
        background: linear-gradient(180deg, rgba(31,24,48,0.7), rgba(14,10,22,0.85));
        border: 1px solid var(--border-hi); border-radius: 4px;
        box-shadow: var(--shadow);
      }
      .lobby-glyph { font-size: 80px; color: var(--gold); text-shadow: 0 0 40px var(--gold); margin-bottom: 16px; }
      .arena-lobby h3, .tower-lobby h3 {
        font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold);
        letter-spacing: 0.15em; margin: 0 0 16px;
      }
      .arena-flavor {
        color: var(--text-dim); font-style: italic; line-height: 1.7;
        font-size: 17px; margin: 16px 0 32px;
      }
      .arena-stats {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px;
        padding: 20px; background: rgba(0,0,0,0.2); border-radius: 2px;
      }
      .arena-stats > div { display: flex; flex-direction: column; gap: 4px; }
      .arena-stats .stat-label { font-size: 10px; }
      .arena-stats .stat-value { font-size: 22px; }
      .arena-score { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 0.1em; }

      .arena-body { max-width: 900px; margin: 0 auto; }
      .arena-timer {
        margin-bottom: 20px; padding: 16px; background: rgba(0,0,0,0.3);
        border: 1px solid var(--border); border-radius: 3px;
        text-align: center;
      }
      .arena-timer.critical { border-color: var(--amber); animation: critical-pulse 0.5s infinite alternate; }
      @keyframes critical-pulse { from { box-shadow: 0 0 15px rgba(217,119,87,0.4); } to { box-shadow: 0 0 35px rgba(217,119,87,0.8); } }
      .timer-value { font-family: 'Cinzel', serif; font-size: 42px; color: var(--gold); letter-spacing: 0.1em; }
      .arena-timer.critical .timer-value { color: var(--amber); }
      .timer-bar { height: 4px; background: rgba(212,197,160,0.1); margin-top: 10px; border-radius: 2px; overflow: hidden; }
      .timer-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--gold)); transition: width 1s linear; }
      .arena-timer.critical .timer-fill { background: var(--amber); }
      .arena-challenge {
        padding: 20px; background: rgba(31,24,48,0.7);
        border: 1px solid var(--border); border-radius: 3px; margin-bottom: 16px;
      }
      .challenge-flag { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 10px; }
      .challenge-prompt { color: var(--text); font-size: 19px; line-height: 1.5; font-style: italic; margin: 0; }
      .arena-editor { min-height: 160px; }

      /* ===== SHOP ===== */
      .shop-coins { font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold); letter-spacing: 0.1em; }
      .shop-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
      .shop-tab {
        background: transparent; border: 1px solid transparent; padding: 8px 24px;
        font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.2em;
        color: var(--text-dim); cursor: pointer; border-radius: 2px;
      }
      .shop-tab.active { color: var(--gold); border-color: var(--gold-dim); background: rgba(212,197,160,0.08); }
      .shop-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
      }
      .shop-card {
        padding: 22px 18px; background: linear-gradient(180deg, rgba(31,24,48,0.7), rgba(14,10,22,0.5));
        border: 1px solid var(--border); border-radius: 3px;
        text-align: center; transition: all 0.3s ease;
      }
      .shop-card:hover { transform: translateY(-3px); border-color: var(--gold-dim); }
      .shop-card.owned { border-color: rgba(110,155,122,0.5); background: linear-gradient(180deg, rgba(110,155,122,0.1), rgba(14,10,22,0.5)); }
      .shop-card.equipped { border-color: var(--gold); box-shadow: 0 0 25px rgba(212,197,160,0.2); }
      .shop-icon { font-size: 42px; margin-bottom: 12px; }
      .shop-name { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 10px; }
      .shop-price { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 18px; margin: 8px 0; }
      .shop-lock { color: var(--gold-dim); font-style: italic; font-size: 12px; margin: 6px 0; }
      .shop-buy { width: 100%; margin-top: 8px; }
      .shop-equipped { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.2em; color: var(--gold); padding: 8px; background: rgba(212,197,160,0.1); border-radius: 2px; margin-top: 8px; }

      /* Header right cluster (Arena/Tower active states with schema button + score) */
      .header-right-cluster {
        display: flex; align-items: center; gap: 12px;
      }
      .btn-ghost.btn-tight {
        padding: 8px 14px; font-size: 11px;
      }

      /* Schema Modal */
      .schema-modal-overlay {
        position: fixed; inset: 0;
        background: rgba(6,4,12,0.78);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000;
        animation: schemaFadeIn 0.25s ease;
        padding: 40px 20px;
      }
      @keyframes schemaFadeIn { from { opacity: 0; } to { opacity: 1; } }
      .schema-modal {
        background: linear-gradient(180deg, #1a1228 0%, #0e0a16 100%);
        border: 1px solid var(--gold-dim);
        border-radius: 4px;
        max-width: 1100px; width: 100%;
        max-height: 90vh;
        display: flex; flex-direction: column;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(212,197,160,0.08);
        animation: schemaSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes schemaSlideIn {
        from { opacity: 0; transform: translateY(20px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .schema-modal-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        padding: 24px 30px 18px;
        border-bottom: 1px solid var(--border);
        gap: 20px;
      }
      .schema-modal-eyebrow {
        font-family: 'Cinzel', serif;
        font-size: 11px; letter-spacing: 0.3em;
        color: var(--gold-dim);
        margin-bottom: 6px;
      }
      .schema-modal-title {
        font-family: 'Cinzel', serif;
        font-size: 22px; font-weight: 500;
        color: var(--gold);
        margin: 0;
        letter-spacing: 0.05em;
      }
      .schema-modal-close {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--gold-dim);
        width: 36px; height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
        flex-shrink: 0;
      }
      .schema-modal-close:hover {
        color: var(--gold);
        border-color: var(--gold);
        background: rgba(212,197,160,0.08);
        transform: rotate(90deg);
      }
      .schema-modal-body {
        padding: 22px 30px 30px;
        overflow-y: auto;
      }
      .schema-modal-flavor {
        color: var(--parchment);
        opacity: 0.75;
        font-style: italic;
        margin: 0 0 18px;
        font-size: 15px;
        line-height: 1.55;
      }
      .schema-modal-body .schema-viewer {
        max-height: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        overflow: visible;
      }

      /* Footer credit */
      .arcanum-footer {
        position: relative;
        z-index: 5;
        margin-top: 60px;
        padding: 24px 20px 28px;
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--gold-dim);
        border-top: 1px solid var(--border);
        background: linear-gradient(180deg, transparent, rgba(6,4,12,0.5));
      }
      .arcanum-footer .footer-credit {
        color: var(--gold);
        text-decoration: none;
        margin: 0 8px;
        padding: 2px 0;
        border-bottom: 1px solid transparent;
        transition: border-color 0.3s ease, color 0.3s ease;
      }
      .arcanum-footer .footer-credit:hover {
        color: #f0e4c2;
        border-bottom-color: var(--gold);
      }
      .arcanum-footer .footer-tag {
        opacity: 0.7;
        margin-left: 4px;
      }

      @media (max-width: 600px) {
        .schema-modal { max-height: 94vh; }
        .schema-modal-head { padding: 18px 20px 14px; }
        .schema-modal-body { padding: 18px 20px 24px; }
        .schema-modal-title { font-size: 17px; }
        .arcanum-footer { font-size: 9px; letter-spacing: 0.2em; padding: 18px 12px 22px; }
        .arcanum-footer .footer-tag { display: block; margin-top: 4px; margin-left: 0; }
      }
    `}</style>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ArcanumAcademy />);

  </script>
</body>
</html>
